name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"

      - name: Check lockfile
        run: poetry check --lock

      - name: Install project and development dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Test release policy
        run: node --test .github/scripts/release-policy.test.mjs

      - name: Validate PR release selection and version
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/validate-pr-release.mjs

      - name: Lint
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Run tests with coverage
        run: poetry run pytest -m "not device" --cov=device_manager --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Verify wheel build
        run: poetry build --format wheel
