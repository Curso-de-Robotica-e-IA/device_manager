name: Feature request
description: Suggest an improvement or new capability for device_manager.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add related use cases, diagrams, or references.
    validations:
      required: false
